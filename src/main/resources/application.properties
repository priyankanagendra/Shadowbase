spring.application.name=shadowbase-backend

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/shadowbase?options=-c%20TimeZone%3DUTC
spring.datasource.username=shadowbase
spring.datasource.password=shadowbase123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info

# Application timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC